<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="860" height="480" viewBox="0 0 860 480">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11111f"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; font-size: 16px; fill: #d6d6f5; white-space: pre; }
    .k { fill: #ff4fd8 } .v { fill: #00e5ff } .s { fill: #a6ff8f } .c { fill: #6b6f94 } .p { fill: #c9a6ff } .o { fill: #ffcf5c }
    .ln { animation: type .45s steps(24) backwards; }
    @keyframes type { from { opacity: 0; clip-path: inset(0 100% 0 0) } to { opacity: 1; clip-path: inset(0 0 0 0) } }
    .cur { animation: blink 1s steps(1) infinite }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <rect x="1" y="1" width="858" height="478" rx="16" fill="url(#win)" stroke="url(#edge)" stroke-width="1.5" stroke-opacity=".7"/>
  <rect x="1" y="1" width="858" height="44" rx="16" fill="#ffffff" fill-opacity=".03"/>
  <circle cx="28" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="23" r="7" fill="#febc2e"/>
  <circle cx="76" cy="23" r="7" fill="#28c840"/>
  <text x="430" y="28" text-anchor="middle" style="font-size:13px" class="c">saulo.js — node</text>

  <g transform="translate(32 88)">
    <text class="ln" y="0"   style="animation-delay:.2s"><tspan class="c">// quem sou eu, em código</tspan></text>
    <text class="ln" y="30"  style="animation-delay:.6s"><tspan class="k">const</tspan> <tspan class="v">saulo</tspan> = {</text>
    <text class="ln" y="58"  style="animation-delay:1.0s">  <tspan class="p">cargo</tspan>: <tspan class="s">"Desenvolvedor Full Stack"</tspan>,</text>
    <text class="ln" y="86"  style="animation-delay:1.4s">  <tspan class="p">base</tspan>: <tspan class="s">"Brasil"</tspan>,</text>
    <text class="ln" y="114" style="animation-delay:1.8s">  <tspan class="p">linguagens</tspan>: [<tspan class="s">"Lua"</tspan>, <tspan class="s">"JavaScript"</tspan>, <tspan class="s">"SQL"</tspan>],</text>
    <text class="ln" y="142" style="animation-delay:2.2s">  <tspan class="p">especialidades</tspan>: [</text>
    <text class="ln" y="170" style="animation-delay:2.6s">    <tspan class="s">"Sistemas para servidores de roleplay"</tspan>,</text>
    <text class="ln" y="198" style="animation-delay:3.0s">    <tspan class="s">"Interfaces imersivas e responsivas"</tspan>,</text>
    <text class="ln" y="226" style="animation-delay:3.4s">    <tspan class="s">"CDN · Cloudflare R2 · Workers"</tspan>,</text>
    <text class="ln" y="254" style="animation-delay:3.8s">  ],</text>
    <text class="ln" y="282" style="animation-delay:4.2s">  <tspan class="p">combustivel</tspan>: <tspan class="o">Infinity</tspan>, <tspan class="c">// café</tspan></text>
    <text class="ln" y="310" style="animation-delay:4.6s">};</text>
    <text class="ln" y="338" style="animation-delay:5.0s"><tspan class="v">❯</tspan> <tspan class="k">saulo</tspan>.<tspan class="v">contratar</tspan>()  <tspan class="c">// → Discord: saulopeixoto.</tspan></text>
    <rect class="cur" x="0" y="350" width="10" height="20" fill="#00e5ff"/>
  </g>
</svg>
