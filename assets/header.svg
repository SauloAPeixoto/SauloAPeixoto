<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".75" cy=".35" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="20"/></clipPath>
    <clipPath id="plot"><rect x="0" y="0" width="420" height="160"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
    .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) backwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s } .d5 { animation-delay: 1.1s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

    .line { stroke-dasharray: 700; animation: draw 2.6s 1s cubic-bezier(.4,0,.2,1) backwards; }
    @keyframes draw { from { stroke-dashoffset: 700 } to { stroke-dashoffset: 0 } }
    .areaf { animation: fadein 1.2s 2.6s backwards; }
    @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }

    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .9s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }

    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .9; transform: scale(1) } 50% { opacity: .25; transform: scale(2.4) } }

    .blink { animation: blink 1s steps(1) infinite }
    @keyframes blink { 50% { opacity: 0 } }

    .live { animation: live 1.6s ease-in-out infinite }
    @keyframes live { 50% { opacity: .3 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- ===== LEFT: identity ===== -->
    <g transform="translate(64 0)">
      <g class="rise d1">
        <text x="0" y="96" class="mono" font-size="15" fill="#6b7280" letter-spacing="1.5">SELECT * FROM <tspan fill="#d1d5db">profile</tspan> WHERE user = <tspan fill="#8fb4ff">'saulo'</tspan>;</text>
      </g>
      <g class="rise d2">
        <text x="-3" y="178" class="sans" font-size="76" font-weight="700" letter-spacing="-2.5" fill="#f3f4f6">Saulo Peixoto</text>
      </g>
      <g class="rise d3">
        <text x="0" y="222" class="mono" font-size="17" fill="#9ca3af" letter-spacing="2.5">DATA SPECIALIST <tspan fill="#4b5563">/</tspan> DATA ENGINEERING <tspan fill="#4b5563">/</tspan> FRONT-END</text>
      </g>
      <g class="rise d4">
        <line x1="0" y1="252" x2="520" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
      </g>
      <g class="rise d5">
        <circle cx="6" cy="286" r="4" fill="#8fb4ff" class="live"/>
        <text x="20" y="291" class="mono" font-size="14" fill="#d1d5db">disponível para projetos</text>
        <text x="250" y="291" class="mono" font-size="14" fill="#4b5563">|</text>
        <text x="270" y="291" class="mono" font-size="14" fill="#9ca3af">pipelines · KPIs · dashboards</text>
        <rect x="520" y="277" width="9" height="18" fill="#d1d5db" class="blink"/>
      </g>
    </g>

    <!-- ===== RIGHT: dashboard ===== -->
    <g transform="translate(700 54)">
      <rect x="0" y="0" width="440" height="272" rx="14" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/>

      <!-- KPI tiles -->
      <g class="rise d2">
        <text x="20" y="32" class="mono" font-size="11" fill="#6b7280" letter-spacing="1.5">LATÊNCIA</text>
        <text x="20" y="62" class="sans" font-size="26" font-weight="600" fill="#f3f4f6">-62%</text>
      </g>
      <g class="rise d3">
        <text x="160" y="32" class="mono" font-size="11" fill="#6b7280" letter-spacing="1.5">QUERIES/DIA</text>
        <text x="160" y="62" class="sans" font-size="26" font-weight="600" fill="#f3f4f6">1.2M</text>
      </g>
      <g class="rise d4">
        <text x="300" y="32" class="mono" font-size="11" fill="#6b7280" letter-spacing="1.5">UPTIME</text>
        <text x="300" y="62" class="sans" font-size="26" font-weight="600" fill="#8fb4ff">99.9%</text>
      </g>
      <line x1="20" y1="82" x2="420" y2="82" stroke="#ffffff" stroke-opacity=".06"/>

      <!-- chart -->
      <g transform="translate(10 96)">
        <g stroke="#ffffff" stroke-opacity=".05">
          <line x1="10" y1="20" x2="420" y2="20"/>
          <line x1="10" y1="60" x2="420" y2="60"/>
          <line x1="10" y1="100" x2="420" y2="100"/>
          <line x1="10" y1="140" x2="420" y2="140"/>
        </g>

        <!-- bars -->
        <g fill="#ffffff" fill-opacity=".09">
          <rect class="bar" x="24"  y="104" width="22" height="36" rx="3" style="animation-delay:.6s"/>
          <rect class="bar" x="74"  y="92"  width="22" height="48" rx="3" style="animation-delay:.7s"/>
          <rect class="bar" x="124" y="98"  width="22" height="42" rx="3" style="animation-delay:.8s"/>
          <rect class="bar" x="174" y="80"  width="22" height="60" rx="3" style="animation-delay:.9s"/>
          <rect class="bar" x="224" y="72"  width="22" height="68" rx="3" style="animation-delay:1.0s"/>
          <rect class="bar" x="274" y="58"  width="22" height="82" rx="3" style="animation-delay:1.1s"/>
          <rect class="bar" x="324" y="50"  width="22" height="90" rx="3" style="animation-delay:1.2s"/>
          <rect class="bar" x="374" y="34"  width="22" height="106" rx="3" style="animation-delay:1.3s" fill="#8fb4ff" fill-opacity=".35"/>
        </g>

        <!-- trend -->
        <path class="areaf" d="M35 112 L85 100 L135 106 L185 84 L235 76 L285 58 L335 48 L385 24 L385 140 L35 140 Z" fill="url(#area)"/>
        <path class="line" d="M35 112 L85 100 L135 106 L185 84 L235 76 L285 58 L335 48 L385 24" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <g class="areaf">
          <circle cx="385" cy="24" r="4" fill="#8fb4ff" class="pulse"/>
          <circle cx="385" cy="24" r="4" fill="#8fb4ff"/>
        </g>

        <text x="24" y="160" class="mono" font-size="10" fill="#4b5563" letter-spacing="1">JAN</text>
        <text x="374" y="160" class="mono" font-size="10" fill="#4b5563" letter-spacing="1">AGO</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="379" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
