<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset="0.55" stop-color="#120a2a"/>
      <stop offset="1" stop-color="#1b0b35"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.35" stop-color="#00e5ff"/>
      <stop offset="0.65" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#7c5cff"/>
      <animate attributeName="x1" values="-1200;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#00e5ff" stop-opacity=".35"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#ff4fd8" stop-opacity=".35"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#fade)"/></mask>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
    .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
    .float1 { animation: f1 14s ease-in-out infinite }
    .float2 { animation: f2 18s ease-in-out infinite }
    .float3 { animation: f3 16s ease-in-out infinite }
    @keyframes f1 { 50% { transform: translate(120px, 40px) } }
    @keyframes f2 { 50% { transform: translate(-140px, -30px) } }
    @keyframes f3 { 50% { transform: translate(60px, -50px) } }
    .blink { animation: blink 1s steps(1) infinite }
    @keyframes blink { 50% { opacity: 0 } }
    .scan { animation: scan 5s linear infinite }
    @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(420px) } }
    .spark { animation: spark 3s ease-in-out infinite }
    @keyframes spark { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    .ring { transform-origin: 1035px 190px; animation: spin 24s linear infinite }
    .ring2 { transform-origin: 1035px 190px; animation: spin 16s linear infinite reverse }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <g class="float1"><circle cx="220" cy="80" r="260" fill="url(#orbA)"/></g>
    <g class="float2"><circle cx="980" cy="320" r="240" fill="url(#orbB)"/></g>
    <g class="float3"><circle cx="640" cy="20" r="200" fill="url(#orbC)"/></g>

    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="40" fill="url(#fade)" opacity=".05"/>

    <!-- sparks -->
    <g fill="#ffffff">
      <circle class="spark" cx="40" cy="340" r="1.6"/>
      <circle class="spark" cx="420" cy="60" r="1.2" style="animation-delay:.6s"/>
      <circle class="spark" cx="760" cy="330" r="1.8" style="animation-delay:1.2s"/>
      <circle class="spark" cx="880" cy="70" r="1.3" style="animation-delay:1.8s"/>
      <circle class="spark" cx="560" cy="350" r="1.1" style="animation-delay:2.2s"/>
      <circle class="spark" cx="300" cy="190" r="1.4" style="animation-delay:.9s"/>
      <circle class="spark" cx="1150" cy="40" r="1.5" style="animation-delay:1.5s"/>
    </g>

    <!-- right emblem -->
    <g opacity=".9">
      <g class="ring">
        <circle cx="1035" cy="190" r="118" fill="none" stroke="#7c5cff" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 10"/>
        <circle cx="1035" cy="72" r="5" fill="#00e5ff" filter="url(#glow)"/>
      </g>
      <g class="ring2">
        <circle cx="1035" cy="190" r="88" fill="none" stroke="#00e5ff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="60 20"/>
        <circle cx="947" cy="190" r="4" fill="#ff4fd8" filter="url(#glow)"/>
      </g>
      <circle cx="1035" cy="190" r="62" fill="#0b0820" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="1035" y="206" text-anchor="middle" class="mono" font-size="44" font-weight="700" fill="url(#title)" filter="url(#glow)">&lt;/&gt;</text>
    </g>

    <!-- text block -->
    <g transform="translate(70 0)">
      <g class="rise d1">
        <text x="0" y="108" class="mono" font-size="17" fill="#8b8fb3" letter-spacing="2"><tspan fill="#ff4fd8">~</tspan>/github <tspan fill="#00e5ff">❯</tspan> whoami</text>
      </g>

      <g class="rise d2">
        <text x="-3" y="200" class="sans" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#title)" filter="url(#glow)">Saulo Peixoto</text>
      </g>

      <g class="rise d3">
        <text x="0" y="248" class="mono" font-size="20" fill="#e6e6ff" letter-spacing="3">FULL STACK DEVELOPER<tspan fill="#7c5cff"> · </tspan>ROLEPLAY<tspan fill="#7c5cff"> · </tspan>EDGE</text>
      </g>

      <g class="rise d4">
        <rect x="0" y="278" width="190" height="36" rx="18" fill="#7c5cff" fill-opacity=".14" stroke="#7c5cff" stroke-opacity=".6"/>
        <circle cx="22" cy="296" r="5" fill="#3cff9e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="36" y="301" class="mono" font-size="14" fill="#c9c9ff">aberto a projetos</text>

        <rect x="206" y="278" width="214" height="36" rx="18" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".45"/>
        <text x="226" y="301" class="mono" font-size="14" fill="#bff7ff">Lua · JS · Cloudflare</text>
        <rect x="436" y="286" width="10" height="20" fill="#00e5ff" class="blink"/>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
